name: Build apps (Windows / Linux / macOS)

# 클라우드의 윈도우·리눅스·맥 컴퓨터가 각각 클릭실행 앱을 자동 빌드한다.
# OCR 언어데이터(eng/kor)를 앱에 동봉 → 받는 사람은 Tesseract 설치 불필요.
# 수동 실행: GitHub 저장소 → Actions 탭 → 이 워크플로 → "Run workflow"
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PDF-to-Markdown-Windows
            sep: ";"
          - os: ubuntu-latest
            artifact: PDF-to-Markdown-Linux
            sep: ":"
          - os: macos-latest
            artifact: PDF-to-Markdown-macOS
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Download OCR language data (eng + kor)
        shell: bash
        run: |
          mkdir -p tessdata
          base=https://github.com/tesseract-ocr/tessdata_best/raw/main
          curl -fL -o tessdata/eng.traineddata $base/eng.traineddata
          curl -fL -o tessdata/kor.traineddata $base/kor.traineddata
          ls -lh tessdata

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build app (with bundled OCR data)
        run: pyinstaller --onefile --windowed --name "${{ matrix.artifact }}"
          --add-data "tessdata${{ matrix.sep }}tessdata"
          --collect-all pymupdf --collect-all pymupdf4llm --hidden-import fitz
          pdf2md_gui.py

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
